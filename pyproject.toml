[project]
name = "streamstats"
version = "0.1.0"
description = "CLI streamstats analyze: потоковый анализ файлов"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
toolkit = "streamstats.__main__:main"

[tool.ruff]
line-length = 200
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.mypy]
python_version = "3.10"
strict = true